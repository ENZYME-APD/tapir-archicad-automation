# Cloudflare Workers config for the /triage command (setup: README.md).
name = "tapir-discord-triage"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Role and user IDs allowed to run /triage; nobody is allowed while both are empty.
ALLOWED_ROLE_IDS = ""
ALLOWED_USER_IDS = ""
# The Tapir server's ID; the command is refused anywhere else.
DISCORD_GUILD_ID = ""

# Secrets (wrangler secret put <name>), never written here:
#   DISCORD_PUBLIC_KEY   the Discord application's public key
#   GITHUB_TOKEN         fine-grained token, Actions: read and write, this repository only
