name: Archicad Add-On Build Check

# Pull requests that only change files in the skip list of
# .github/actions/build-gate - docs/**, archicad-addon/Test/**,
# archicad-addon/Examples/**, archicad-addon/Workflows/**, builtin-scripts/**,
# marketplace/**, branding/**, **/*.md - build nothing: the `changes` job
# finds that out and build_win and build_mac are skipped by their `if:`, so
# their checks still appear, as skipped, which the bot PR steward, auto-merge
# and GitHub's required checks all count as passing. build_win still runs
# when a check under archicad-addon/Test/checks/ changed (the community test
# runner tests it with this build). generate_docs and devkits always run, and
# pushes to main always build. Not paths-ignore: that would skip the whole
# workflow, and the checks the steward and auto-merge wait for would never
# appear.
on:
  # Pushes to main only: a pull request's branch is built by its
  # pull_request run, and building it on push as well doubled every run.
  push:
    branches: [main]
  pull_request:
  # Started by claude_bot_pr_steward.yml for the pull requests the issue bot
  # opens: their pushes are made with GITHUB_TOKEN, which starts no push or
  # pull_request run, but a workflow_dispatch it sends does run, on the bot's
  # branch, and its checks show on the pull request.
  workflow_dispatch:

# A newer push to the same pull request or branch supersedes a run still
# queued or building; main keeps every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  generate_docs:
    # The weekly release regenerates docs/archicad-addon with this script;
    # running it here reports schema code it cannot evaluate on the PR that
    # adds it instead of at release time.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Generate the docs
      run: python3 tools/generate_addon_docs.py
    # One example per command, at archicad-addon/Examples/<Group>/<CommandName>.py;
    # the docs show it in the command's Example popdown.
    - name: Check the examples
      run: python3 tools/check_examples.py

  # Whether this change needs the builds below (see the top of this file).
  # If it fails, they build (`changes` outputs nothing, which is not 'false').
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.gate.outputs.build }}
      win-build: ${{ steps.gate.outputs.win-build }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        filter: blob:none
        sparse-checkout: .github/actions
    - name: Decide whether to build
      id: gate
      uses: ./.github/actions/build-gate

  # The Archicad versions to build, from archicad-addon/devkits.json (the one
  # list of supported versions; tools/devkits.py validates it).
  devkits:
    runs-on: ubuntu-latest
    outputs:
      win: ${{ steps.list.outputs.win }}
      mac: ${{ steps.list.outputs.mac }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Read the DevKit list
      id: list
      run: |
        echo "win=$(python3 tools/devkits.py matrix WIN)" >> "$GITHUB_OUTPUT"
        echo "mac=$(python3 tools/devkits.py matrix MAC)" >> "$GITHUB_OUTPUT"

  build_win:
    needs: [devkits, changes]
    if: ${{ !cancelled() && needs.devkits.result == 'success' && needs.changes.outputs.win-build != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        params: ${{ fromJSON(needs.devkits.outputs.win) }}
    runs-on: [ windows-2022 ]
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
    - name: Download Development Kit
      run: python archicad-addon/Tools/download_and_unzip.py ${{ matrix.params.devKitUrl }} archicad-addon/Build/DevKits/AC${{ matrix.params.acVersion }}
    - name: Generate Project <AC29
      if: matrix.params.acVersion < 29
      run: cmake -B archicad-addon/Build -G "Visual Studio 17 2022" -A "x64" -T "v142" -DAC_VERSION=${{ matrix.params.acVersion }} -DAC_API_DEVKIT_DIR="archicad-addon/Build/DevKits/AC${{ matrix.params.acVersion }}/Support" archicad-addon
    - name: Generate Project >=AC29
      if: matrix.params.acVersion >= 29
      run: cmake -B archicad-addon/Build -G "Visual Studio 17 2022" -A "x64" -T "v143" -DAC_VERSION=${{ matrix.params.acVersion }} -DAC_API_DEVKIT_DIR="archicad-addon/Build/DevKits/AC${{ matrix.params.acVersion }}/Support" archicad-addon
    - name: Build Debug
      run: cmake --build archicad-addon/Build --config Debug
    - name: Build RelWithDebInfo
      run: cmake --build archicad-addon/Build --config RelWithDebInfo
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tapir Add-On AC${{ matrix.params.acVersion }} Win
        path: archicad-addon/Build/RelWithDebInfo/TapirAddOn_AC${{ matrix.params.acVersion }}_Win.apx

  build_mac:
    needs: [devkits, changes]
    if: ${{ !cancelled() && needs.devkits.result == 'success' && needs.changes.outputs.build != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        params: ${{ fromJSON(needs.devkits.outputs.mac) }}
    runs-on: ${{ matrix.params.acVersion < 26 && 'macos-15-intel' || 'macos-latest' }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Download Development Kit
      run: python3 archicad-addon/Tools/download_and_unzip.py ${{ matrix.params.devKitUrl }} archicad-addon/Build/DevKits/AC${{ matrix.params.acVersion }}
    - name: Generate Project
      run: cmake -B archicad-addon/Build -G "Xcode" -DAC_VERSION=${{ matrix.params.acVersion }} -DAC_API_DEVKIT_DIR="archicad-addon/Build/DevKits/AC${{ matrix.params.acVersion }}/Support" archicad-addon
    - name: Build Debug
      run: cmake --build archicad-addon/Build --config Debug
    - name: Build RelWithDebInfo
      run: cmake --build archicad-addon/Build --config RelWithDebInfo
    - name: Create zip file
      run: ditto -c -k --keepParent archicad-addon/Build/RelWithDebInfo/TapirAddOn_AC${{ matrix.params.acVersion }}_Mac.bundle archicad-addon/Build/RelWithDebInfo/TapirAddOn_AC${{ matrix.params.acVersion }}_Mac.zip
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tapir Add-On AC${{ matrix.params.acVersion }} Mac
        path: archicad-addon/Build/RelWithDebInfo/TapirAddOn_AC${{ matrix.params.acVersion }}_Mac.zip
