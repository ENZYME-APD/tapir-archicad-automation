name: Grasshopper Plugin Build Check

on:
  # Pushes to main only: a pull request's branch is built by its
  # pull_request run, and building it on push as well doubled every run.
  push:
    branches: [main]
  pull_request:
  # Started by claude_bot_pr_steward.yml for the pull requests the issue bot
  # opens: their pushes are made with GITHUB_TOKEN, which starts no push or
  # pull_request run, but a workflow_dispatch it sends does run, on the bot's
  # branch, and its checks show on the pull request.
  workflow_dispatch:

# A newer push to the same pull request or branch supersedes a run still
# queued or building; main keeps every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    strategy:
      fail-fast: false
    runs-on: [ windows-2022 ]
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Setup msbuild
      uses: microsoft/setup-msbuild@v2
    - name: Setup nuget
      uses: nuget/setup-nuget@v2
    - name: Restore nuget packages
      run: nuget restore grasshopper-plugin/TapirGrasshopperPlugin.sln
    - name: Build debug
      run: msbuild grasshopper-plugin/TapirGrasshopperPlugin.sln -property:Configuration=Debug
    - name: Build release
      run: msbuild grasshopper-plugin/TapirGrasshopperPlugin.sln -property:Configuration=Release
    - name: Create yak package
      run: grasshopper-plugin/create_package_win.bat
    - name: Get yak
      # Over HTTPS, and failing at once on an HTTP error: over plain HTTP anything on the
      # network between the runner and McNeel's CDN could replace the executable this job
      # then runs, in the .yak of this check's artifact. (The release builds its own .yak in
      # grasshopper_plugin.yml, which gets yak from paramdigma/setup-yak.) --fail also keeps
      # curl from saving an error page as yak.exe.
      #
      # It is still 'latest', which McNeel rotates: a pinned digest would break this build the
      # day they publish a new one, and files.mcneel.com has no versioned path. The digest and
      # the signature of what was downloaded go to the log, so a rotation is visible in the run
      # that picked it up.
      shell: pwsh
      run: |
        curl.exe --fail --silent --show-error --location --retry 3 --retry-delay 2 --output yak.exe https://files.mcneel.com/yak/tools/latest/yak.exe
        Write-Host "yak.exe SHA256 $((Get-FileHash -Algorithm SHA256 yak.exe).Hash)"
        # Not a gate: a missing signature is reported, not failed on, because only the digest
        # above can tell a replaced file from a rotated one.
        Get-AuthenticodeSignature yak.exe | Format-List Status, StatusMessage, SignerCertificate
    - name: Build yak package
      run: ..\..\yak.exe build
      working-directory: grasshopper-plugin/YakPackage
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tapir Grasshopper Plugin
        path: grasshopper-plugin/YakPackage/*.yak
