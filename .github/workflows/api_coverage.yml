# Keeps the Archicad API coverage checklist live.
#
# tools/generate_api_coverage.py lists every item of the Archicad API in the
# DevKits of every supported version (C functions with their older names and
# AC25/26 command ids, and the C++ API) and marks what archicad-addon/Sources
# uses, what an open pull request adds and what an open issue claims. This
# workflow reruns it within minutes of any change to those:
#   - a push to main, a published release,
#   - a pull request opened, updated, closed or reopened,
#   - an issue opened, edited, closed, reopened or deleted,
#   - hourly, in case an event was missed, and by hand.
# A newer run cancels an older one, so a burst of events costs one run.
#
# The same run also writes the Grasshopper coverage of the Tapir commands
# (tools/generate_gh_coverage.py): which Add-On commands a Grasshopper
# component calls, and whether the components cover their parameters. It is
# published next to the API checklist as gh-coverage.* (read by
# docs/gh-coverage/index.html).
#
# It publishes without touching main:
#   - api-coverage.json, api-coverage.md and api-coverage-summary.md as one
#     commit on the api-coverage branch (read by docs/api-coverage/index.html
#     and readable on GitHub), with api-coverage-badge.json (a shields.io
#     endpoint badge) and api-coverage.svg / api-coverage-dark.svg (the summary
#     as an image): the README shows those two from the branch, so it never
#     changes when the coverage does,
#   - the summary in the body of the tracking issue whose number is in the
#     API_COVERAGE_ISSUE repository variable, when it is set.
#
# Security: pull_request_target runs this file from main with a write token,
# so it must never check out or run code from the pull request. It reads a
# pull request only through the API (its title and the lines its diff adds)
# and treats that as text. API_COVERAGE=false turns the workflow off.

name: API Coverage

on:
  push:
    branches: [main]
  release:
    types: [published]
  pull_request_target:
    types: [opened, synchronize, reopened, closed, edited]
  issues:
    types: [opened, edited, closed, reopened, deleted]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

concurrency:
  group: api-coverage
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  update:
    if: vars.API_COVERAGE != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      # The headers of every version in archicad-addon/devkits.json, cached.
      - name: Download the DevKits
        uses: ./.github/actions/download-devkits
        with:
          path: devkits
          examples: 'false'

      - name: Get the sources of the latest release
        run: |
          set -eu
          tag=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          mkdir -p release
          if [ -n "$tag" ]; then
            git archive "$tag" archicad-addon/Sources grasshopper-plugin/TapirGrasshopperPlugin | tar -x -C release
          fi
          echo "RELEASE_SOURCES=$([ -n "$tag" ] && echo release/archicad-addon/Sources || true)" >> "$GITHUB_ENV"
          echo "RELEASE_PLUGIN=$([ -n "$tag" ] && echo release/grasshopper-plugin/TapirGrasshopperPlugin || true)" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Read the open pull requests and issues
        run: python3 tools/fetch_api_coverage_github_data.py "$GITHUB_REPOSITORY" github.json
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate the checklist
        run: |
          set -eu
          args=""
          for dir in devkits/AC*; do
            args="$args --devkit ${dir#devkits/AC}=$dir/Support"
          done
          release_arg=""
          [ -n "$RELEASE_SOURCES" ] && release_arg="--release-sources $RELEASE_SOURCES"
          python3 tools/generate_api_coverage.py $args \
            --sources archicad-addon/Sources $release_arg \
            --github-data github.json \
            --rules tools/api_coverage_rules.json \
            --out-dir out

      - name: Generate the Grasshopper coverage
        run: |
          set -eu
          release_arg=""
          [ -n "$RELEASE_PLUGIN" ] && release_arg="--release-sources $RELEASE_PLUGIN"
          python3 tools/generate_gh_coverage.py \
            --sources grasshopper-plugin/TapirGrasshopperPlugin $release_arg \
            --github-data github.json \
            --rules tools/gh_coverage_rules.json \
            --out-dir out

      - name: Publish to the api-coverage branch
        run: |
          set -eu
          files="api-coverage.json api-coverage.md api-coverage-summary.md api-coverage-badge.json api-coverage.svg api-coverage-dark.svg
                 gh-coverage.json gh-coverage.md gh-coverage-summary.md gh-coverage-badge.json gh-coverage.svg gh-coverage-dark.svg"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch -q origin api-coverage; then
            git worktree add -q publish FETCH_HEAD
          else
            git worktree add -q --detach publish
            git -C publish checkout -q --orphan api-coverage
            # -f: on the new orphan branch the files of main are staged, not committed.
            git -C publish rm -rqf .
          fi
          for file in $files; do cp "out/$file" publish/; done
          cd publish
          git add $files
          if git diff --cached --quiet; then
            echo "The checklist did not change."
            exit 0
          fi
          base=$(git rev-parse -q --verify HEAD || true)
          git commit -q -m "Update the Archicad API and Grasshopper coverage checklists"
          if git push -q origin HEAD:api-coverage; then
            exit 0
          fi
          # A newer run may have pushed meanwhile: it had newer data, so give way.
          # Any other rejection (ruleset, token) leaves the branch where it was.
          if git fetch -q origin api-coverage && [ "$(git rev-parse FETCH_HEAD)" != "$base" ]; then
            echo "::notice::api-coverage moved meanwhile; a newer run published."
          else
            echo "::error::Pushing to api-coverage failed and the branch did not move."
            exit 1
          fi

      - name: Update the tracking issue
        if: vars.API_COVERAGE_ISSUE != ''
        run: |
          set -eu
          {
            echo '# Archicad API coverage'
            echo
            echo 'Every function of the Archicad API and whether Tapir uses it, kept up to date within minutes by `.github/workflows/api_coverage.yml`.'
            echo
            echo "- **Full list, searchable:** https://enzyme-apd.github.io/tapir-archicad-automation/api-coverage/"
            echo "- **As Markdown:** https://github.com/$GITHUB_REPOSITORY/blob/api-coverage/api-coverage.md"
            echo '- **Start on an open item:** file an "Archicad API request" issue that names its functions; that marks them as claimed here, and the issue bot builds them.'
            echo
            cat out/api-coverage-summary.md
          } > issue-body.md
          gh issue edit "${{ vars.API_COVERAGE_ISSUE }}" --body-file issue-body.md
        env:
          GH_TOKEN: ${{ github.token }}
