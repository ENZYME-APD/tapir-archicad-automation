name: Archicad Add-On Build and Release

on:
  push:
    tags:
      - '*'
  # The Weekly Release workflow pushes its tag with the workflow's own
  # GITHUB_TOKEN, which does not trigger on-push workflows - so it starts
  # this pipeline explicitly, dispatched on the tag ref.
  workflow_dispatch:

jobs:
  # When adding or removing an Archicad version in the matrices below, or an
  # installer job, also update EXPECTED_ASSETS in weekly_release.yml - it is
  # the number of release assets (Win + Mac per version, plus the Win + Mac
  # installer executables) the weekly release waits for before publishing.
  build_win:
    strategy:
      matrix:
        params:
          - acVersion: 25
            devKitUrl: https://github.com/GRAPHISOFT/archicad-api-devkit/releases/download/25.3002/API.Development.Kit.WIN.25.3002.zip
          - acVersion: 26
            devKitUrl: https://github.com/GRAPHISOFT/archicad-api-devkit/releases/download/26.3000/API.Development.Kit.WIN.26.3000.zip
          - acVersion: 27
            devKitUrl: https://github.com/GRAPHISOFT/archicad-api-devkit/releases/download/27.3001/API.Development.Kit.WIN.27.3001.zip
          - acVersion: 28
            devKitUrl: https://github.com/GRAPHISOFT/archicad-api-devkit/releases/download/28.3001/API.Development.Kit.WIN.28.3001.zip
          - acVersion: 29
            devKitUrl: https://github.com/GRAPHISOFT/archicad-api-devkit/releases/download/29.3000/API.Development.Kit.WIN.29.3000.zip
          # Release candidate DevKit, not on the GitHub releases yet: switch
          # to the final one (here and in archicad_addon_build_check.yml)
          # when it is published.
          - acVersion: 30
            devKitUrl: https://dl.graphisoft.com/release-candidate/30/API.Development.Kit.WIN.30.2000.zip
    runs-on: [ windows-2022 ]
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
    - name: Download Development Kit
      run: python archicad-addon/Tools/download_and_unzip.py ${{ matrix.params.devKitUrl }} archicad-addon/Build/DevKits/AC${{ matrix.params.acVersion }}
    - name: Generate Project <AC29
      if: matrix.params.acVersion < 29
      run: cmake -B archicad-addon/Build -G "Visual Studio 17 2022" -A "x64" -T "v142" -DAC_VERSION=${{ matrix.params.acVersion }} -DAC_API_DEVKIT_DIR="archicad-addon/Build/DevKits/AC${{ matrix.params.acVersion }}/Support" archicad-addon
    - name: Generate Project >=AC29
      if: matrix.params.acVersion >= 29
      run: cmake -B archicad-addon/Build -G "Visual Studio 17 2022" -A "x64" -T "v143" -DAC_VERSION=${{ matrix.params.acVersion }} -DAC_API_DEVKIT_DIR="archicad-addon/Build/DevKits/AC${{ matrix.params.acVersion }}/Support" archicad-addon
    - name: Build Debug
      run: cmake --build archicad-addon/Build --config Debug
    - name: Build RelWithDebInfo
      run: cmake --build archicad-addon/Build --config RelWithDebInfo
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tapir Add-On AC${{ matrix.params.acVersion }} Win
        path: archicad-addon/Build/RelWithDebInfo/TapirAddOn_AC${{ matrix.params.acVersion }}_Win.apx
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: ncipollo/release-action@v1
      with:
        artifacts: archicad-addon/Build/RelWithDebInfo/TapirAddOn_AC${{ matrix.params.acVersion }}_Win.apx
        draft: true
        allowUpdates: true
        # The release flow only ever updates drafts; a stray dispatch on an
        # already-shipped tag must fail instead of flipping the published
        # release back to draft and overwriting its assets.
        updateOnlyUnreleased: true
        token: ${{ secrets.GITHUB_TOKEN }}

  build_mac:
    strategy:
      matrix:
        params:
          - acVersion: 25
            devKitUrl: https://github.com/GRAPHISOFT/archicad-api-devkit/releases/download/25.3002/API.Development.Kit.MAC.25.3002.zip
          - acVersion: 26
            devKitUrl: https://github.com/GRAPHISOFT/archicad-api-devkit/releases/download/26.3000/API.Development.Kit.MAC.26.3000.zip
          - acVersion: 27
            devKitUrl: https://github.com/GRAPHISOFT/archicad-api-devkit/releases/download/27.3001/API.Development.Kit.MAC.27.3001.zip
          - acVersion: 28
            devKitUrl: https://github.com/GRAPHISOFT/archicad-api-devkit/releases/download/28.3001/API.Development.Kit.MAC.28.3001.zip
          - acVersion: 29
            devKitUrl: https://github.com/GRAPHISOFT/archicad-api-devkit/releases/download/29.3000/API.Development.Kit.MAC.29.3000.zip
          # Release candidate DevKit, not on the GitHub releases yet: switch
          # to the final one (here and in archicad_addon_build_check.yml)
          # when it is published.
          - acVersion: 30
            devKitUrl: https://dl.graphisoft.com/release-candidate/30/API.Development.Kit.MAC.30.2000.zip
    runs-on: ${{ matrix.params.acVersion < 26 && 'macos-15-intel' || 'macos-latest' }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Download Development Kit
      run: python3 archicad-addon/Tools/download_and_unzip.py ${{ matrix.params.devKitUrl }} archicad-addon/Build/DevKits/AC${{ matrix.params.acVersion }}
    - name: Generate Project
      run: cmake -B archicad-addon/Build -G "Xcode" -DAC_VERSION=${{ matrix.params.acVersion }} -DAC_API_DEVKIT_DIR="archicad-addon/Build/DevKits/AC${{ matrix.params.acVersion }}/Support" archicad-addon
    - name: Build Debug
      run: cmake --build archicad-addon/Build --config Debug
    - name: Build RelWithDebInfo
      run: cmake --build archicad-addon/Build --config RelWithDebInfo
    - name: Code sign and notarize
      run: |
        echo ${{ secrets.CODE_SIGN_CERT }} | base64 --decode > certificate.p12
        ./archicad-addon/Tools/code_sign_and_notarize.sh \
          certificate.p12 \
          ${{ secrets.CODE_SIGN_CERT_PWD }} \
          "Developer ID Application: enzyme apd Limited (${{ secrets.TEAM_ID }})" \
          archicad-addon/Tools/addon.entitlements \
          ${{ secrets.APPLE_ID }} \
          ${{ secrets.APPLE_ID_PWD }} \
          ${{ secrets.TEAM_ID }} \
          archicad-addon/Build/RelWithDebInfo/TapirAddOn_AC${{ matrix.params.acVersion }}_Mac.bundle
    - name: Create zip file
      run: ditto -c -k --keepParent archicad-addon/Build/RelWithDebInfo/TapirAddOn_AC${{ matrix.params.acVersion }}_Mac.bundle archicad-addon/Build/RelWithDebInfo/TapirAddOn_AC${{ matrix.params.acVersion }}_Mac.zip
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tapir Add-On AC${{ matrix.params.acVersion }} Mac
        path: archicad-addon/Build/RelWithDebInfo/TapirAddOn_AC${{ matrix.params.acVersion }}_Mac.zip
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: ncipollo/release-action@v1
      with:
        artifacts: archicad-addon/Build/RelWithDebInfo/TapirAddOn_AC${{ matrix.params.acVersion }}_Mac.zip
        draft: true
        allowUpdates: true
        # Same guard as the Windows job: only drafts may be updated.
        updateOnlyUnreleased: true
        token: ${{ secrets.GITHUB_TOKEN }}

  build_installer_win:
    runs-on: [ windows-2022 ]
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install PyInstaller
      run: pip install pyinstaller truststore certifi
    - name: Build Installer
      run: pyinstaller --noconfirm --onefile --windowed --uac-admin --name TapirInstaller --icon archicad-addon/Installer/Resources/TapirInstaller.ico --distpath dist archicad-addon/Installer/tapir_installer.py
    - name: Rename Installer
      run: Move-Item dist/TapirInstaller.exe dist/TapirInstaller_Win.exe
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tapir Installer Win
        path: dist/TapirInstaller_Win.exe
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: ncipollo/release-action@v1
      with:
        artifacts: dist/TapirInstaller_Win.exe
        draft: true
        allowUpdates: true
        # Same guard as the add-on jobs: only drafts may be updated.
        updateOnlyUnreleased: true
        token: ${{ secrets.GITHUB_TOKEN }}

  build_installer_mac:
    runs-on: [ macos-latest ]
    # The installer must run on Intel Macs too, like the add-ons, but
    # macos-latest is an Apple silicon runner. PyInstaller builds a universal2
    # app only from a universal2 Python, so this installs the official
    # python.org universal2 package, pinned by version and SHA-256 (3.12.10 is
    # the last 3.12 release with a macOS installer). Keep these values the
    # same as in installer_build_check.yml.
    env:
      PYTHON_PKG_URL: https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
      PYTHON_PKG_SHA256: 8373e58da4ea146b3eb1c1f9834f19a319440b6b679b06050b1f9ee3237aa8e4
      UNIVERSAL2_PYTHON: /Library/Frameworks/Python.framework/Versions/3.12/bin/python3
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
    - name: Setup Python
      run: |
        curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/python.pkg" "$PYTHON_PKG_URL"
        actual=$(shasum -a 256 "$RUNNER_TEMP/python.pkg" | cut -d ' ' -f 1)
        if [ "$actual" != "$PYTHON_PKG_SHA256" ]; then
          echo "::error::SHA-256 of $PYTHON_PKG_URL is '$actual', expected $PYTHON_PKG_SHA256"
          exit 1
        fi
        sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
        "$UNIVERSAL2_PYTHON" -c "import sys, sysconfig; p = sysconfig.get_platform(); print(sys.version, p); sys.exit(not p.endswith('-universal2'))"
    - name: Install PyInstaller
      run: |
        "$UNIVERSAL2_PYTHON" -m pip install pyinstaller truststore certifi
    - name: Build Installer
      run: |
        "$UNIVERSAL2_PYTHON" -m PyInstaller --noconfirm --windowed --target-arch universal2 --name TapirInstaller --icon archicad-addon/Installer/Resources/TapirInstaller.icns --osx-bundle-identifier com.enzyme-apd.tapir-installer --distpath dist archicad-addon/Installer/tapir_installer.py
    # Every Mach-O file in the app (the executable, the Python, Tcl/Tk and
    # OpenSSL libraries, the extension modules) must have both slices.
    - name: Verify Universal2
      run: |
        exe=dist/TapirInstaller.app/Contents/MacOS/TapirInstaller
        archs=$(lipo -archs "$exe")
        echo "$exe: $archs"
        if [[ " $archs " != *" x86_64 "* || " $archs " != *" arm64 "* ]]; then
          echo "::error::$exe is not universal2 (has: $archs)"
          exit 1
        fi
        failed=0
        names=()
        while IFS= read -r -d '' f; do
          case "$(file -b "$f")" in
            *Mach-O*) ;;
            *) continue ;;
          esac
          names+=("${f##*/}")
          archs=$(lipo -archs "$f" 2>&1) || true
          echo "$archs  ${f#dist/TapirInstaller.app/}"
          if [[ " $archs " != *" x86_64 "* || " $archs " != *" arm64 "* ]]; then
            echo "::error::${f#dist/} is not universal2 (has: $archs)"
            failed=1
          fi
        done < <(find dist/TapirInstaller.app -type f -print0)
        echo "Checked ${#names[@]} Mach-O files."
        # Make sure the libraries were found at all, so a pass means something.
        for prefix in Python libtcl libtk; do
          if ! printf '%s\n' "${names[@]}" | grep -q "^$prefix"; then
            echo "::error::No Mach-O file named $prefix* in dist/TapirInstaller.app"
            failed=1
          fi
        done
        exit "$failed"
    - name: Code sign and notarize
      run: |
        echo ${{ secrets.CODE_SIGN_CERT }} | base64 --decode > certificate.p12
        ./archicad-addon/Tools/code_sign_and_notarize.sh \
          certificate.p12 \
          ${{ secrets.CODE_SIGN_CERT_PWD }} \
          "Developer ID Application: enzyme apd Limited (${{ secrets.TEAM_ID }})" \
          archicad-addon/Installer/installer.entitlements \
          ${{ secrets.APPLE_ID }} \
          ${{ secrets.APPLE_ID_PWD }} \
          ${{ secrets.TEAM_ID }} \
          dist/TapirInstaller.app
    - name: Verify Signature
      run: |
        spctl -a -vv dist/TapirInstaller.app
        xcrun stapler validate dist/TapirInstaller.app
    - name: Create zip file
      run: ditto -c -k --keepParent dist/TapirInstaller.app dist/TapirInstaller_Mac.zip
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tapir Installer Mac
        path: dist/TapirInstaller_Mac.zip
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: ncipollo/release-action@v1
      with:
        artifacts: dist/TapirInstaller_Mac.zip
        draft: true
        allowUpdates: true
        # Same guard as the add-on jobs: only drafts may be updated.
        updateOnlyUnreleased: true
        token: ${{ secrets.GITHUB_TOKEN }}
