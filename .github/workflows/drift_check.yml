name: Generated File Drift Check

# Two generators can compare what they would write with what is committed:
# tools/generate_gh_docs.py --check and python-client/generate.py --check. No workflow ever ran either
# of them, so the files they write were current only when someone remembered to run the generator. That
# is how docs/grasshopper-components/components.js came to list four components whose .cs files no longer
# exist and to miss one that does.
#
# The generate_docs job of archicad_addon_build_check.yml runs tools/generate_addon_docs.py and the
# examples and marketplace checkers on every pull request, but it only writes the docs - it never
# compares them with the branch - so a stale file passes there. This job is that comparison.
#
# Not compared on purpose: the command reference (docs/archicad-addon/*.js) and the AI files
# (docs/commands*, docs/llms*, docs/sitemap.xml). The weekly release regenerates them (see the top of
# weekly_release.yml), so a pull request may leave them up to a week behind its sources.
#
# A separate job rather than steps added to generate_docs: claude_auto_merge.yml and
# claude_bot_pr_steward.yml wait for generate_docs by name, so a job that fails on drift would hold up
# the bot's own pull requests.
#
# Cheap on purpose - no Archicad, no DevKits, no network, about a minute - so it can run on every pull
# request instead of being one more thing to remember.
on:
  # Pushes to main only: a pull request's branch is checked by its pull_request run.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request supersedes a run still queued or running; main keeps
# every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    # The findings are written as error annotations, so what is out of date - and the files to
    # run the generator on - show up on the pull request without opening the log.
    - name: Check that the generated files are current
      run: python3 tools/check_drift.py
