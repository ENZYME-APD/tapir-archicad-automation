name: Archicad API request
description: Ask Tapir to expose Archicad API functions that it does not use yet (see the API coverage checklist).
title: "Expose "
body:
  - type: markdown
    attributes:
      value: |
        Pick open (⬜) items from the [Archicad API coverage checklist](https://enzyme-apd.github.io/tapir-archicad-automation/api-coverage/).
        Naming them below marks them as claimed (🙋) there within minutes, so nobody else starts on them.
        The issue bot reads this issue and builds a pull request for it.
  - type: textarea
    id: functions
    attributes:
      label: API functions
      description: One per line, exactly as the checklist names them (e.g. `ACAPI_Category_GetElementCategories` or `ACAPI::MEP::Pipe::GetLength`).
      placeholder: |
        ACAPI_Category_GetElementCategories
        ACAPI_Category_GetCategoryValue
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: What should Tapir let you do?
      description: The commands you need, their inputs and outputs, and what you would use them for.
    validations:
      required: true
  - type: textarea
    id: declarations
    attributes:
      label: Declarations from the DevKit (optional)
      description: If you have the DevKit, paste the declarations and doc comments of these functions. The issue bot has no DevKit and builds from what is here.
      render: cpp
  - type: dropdown
    id: versions
    attributes:
      label: Archicad versions you need it in
      multiple: true
      options: ["25", "26", "27", "28", "29", "30"]
